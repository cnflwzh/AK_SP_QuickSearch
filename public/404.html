<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="color-scheme" content="light dark">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>页面未找到 · 卫戍速查</title>
  <script>
    // 自建流派的 ID 仅在玩家设备上可知，交由首页路由恢复原地址、查询和分享片段。
    const buildPath = location.pathname.replace(/\/$/, '');
    if (/^\/builds\/[^/?#]+(?:\/edit)?$/.test(buildPath)) {
      const entry = new URL(location.href);
      entry.pathname = '/';
      entry.searchParams.set('buildPath', buildPath);
      location.replace(entry.href);
    }
  </script>
  <link rel="icon" href="/assets/icons/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/assets/css/base.css">
  <script>try{var theme=JSON.parse(localStorage.getItem('wsq.settings.v1')||'{}').theme;if(theme==='light'||theme==='dark')document.documentElement.dataset.theme=theme}catch{}</script>
</head>
<body>
  <main class="wrap route-status-standalone">
    <a class="route-status-brand" href="/"><img src="/assets/icons/favicon.svg" width="26" height="26" alt="">卫戍速查</a>
    <section class="route-status" aria-labelledby="route-status-title">
      <div class="route-status-mark" aria-hidden="true"><span>404</span></div>
      <div class="route-status-body">
        <h1 id="route-status-title">页面未找到</h1>
        <p>请检查链接地址，或返回速查继续查找。</p>
        <div class="route-status-actions"><a class="btn p" href="/">返回速查</a></div>
      </div>
    </section>
  </main>
</body>
</html>
